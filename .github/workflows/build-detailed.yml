name: Detailed Build with Error Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  actions: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx3g"
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --info -PpreDexEnable=false --max-workers 2 --no-daemon

jobs:
  build-with-detailed-logs:
    name: Build with Detailed Error Logging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Display environment info
        run: |
          echo "=== Environment Info ==="
          java -version
          echo "GRADLE_OPTS: $GRADLE_OPTS"
          echo "Available memory:"
          free -h
          echo "Disk space:"
          df -h
          echo "========================"

      - name: Clean build
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK (Gplay) with full logging
        id: build_gplay_debug
        run: |
          echo "=== Starting Gplay Debug Build ===" | tee build.log
          ./gradlew assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES 2>&1 | tee -a build.log
          echo "=== Build completed with exit code: $? ===" | tee -a build.log
        continue-on-error: false

      - name: Capture build logs on failure
        if: failure()
        run: |
          echo "=== BUILD FAILED - Capturing detailed logs ==="
          echo ""
          echo "## 🔴 BUILD ERROR REPORT" > error-report.md
          echo "" >> error-report.md
          echo "### Build Information" >> error-report.md
          echo "- **Commit**: ${{ github.sha }}" >> error-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> error-report.md
          echo "- **Workflow**: ${{ github.workflow }}" >> error-report.md
          echo "- **Run ID**: ${{ github.run_id }}" >> error-report.md
          echo "" >> error-report.md
          
          echo "### Error Summary" >> error-report.md
          echo '```' >> error-report.md
          grep -i "error\|failed\|exception" build.log | head -50 >> error-report.md || echo "No explicit errors found in log" >> error-report.md
          echo '```' >> error-report.md
          echo "" >> error-report.md
          
          echo "### Last 200 lines of build log" >> error-report.md
          echo '```' >> error-report.md
          tail -200 build.log >> error-report.md || echo "Could not read build log" >> error-report.md
          echo '```' >> error-report.md
          echo "" >> error-report.md
          
          echo "### Full Build Log" >> error-report.md
          echo '```' >> error-report.md
          cat build.log >> error-report.md
          echo '```' >> error-report.md

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-full-log
          path: |
            build.log
            error-report.md
          retention-days: 14

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: error-report
          path: error-report.md
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/
          retention-days: 7

      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gplay Debug | ${{ steps.build_gplay_debug.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Flavor**: Google Play (with Firebase notifications)" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: Debug" >> $GITHUB_STEP_SUMMARY
          echo "- **Use**: Testing and development" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f error-report.md ]; then
            echo "### ⚠️ Build Failed - See [error report](error-report.md) for details" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any build failed
        if: failure()
        run: exit 1
